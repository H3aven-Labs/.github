name: Release New SDK Version

# This is a reusable workflow for organization-wide use
on:
  workflow_call:
    inputs:
      version_bump:
        description: "Type of version bump"
        required: false
        type: string
        default: "minor"
      openapi_format:
        description: "OpenAPI file format to copy (yml or json)"
        required: false
        type: string
        default: "yml"
      skip_prisma_setup:
        description: "Skip running yarn prisma:setup:sqlite"
        required: false
        type: boolean
        default: false
      auto_merge:
        description: "Add --auto-merge to commit message"
        required: false
        type: string
        default: "false"
      update_docs:
        description: "Update API reference documentation in docs repository"
        required: false
        type: boolean
        default: false

jobs:
  build_and_release:
    # Default: GitHub-hosted. When included Actions minutes are exhausted,
    # flip without a workflow PR:
    #   gh variable set CI_RUNNER --body blacksmith-2vcpu-ubuntu-2404
    # Revert: gh variable delete CI_RUNNER
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Runs racing on the same SDK would compute the same version number
    concurrency:
      group: sdk-release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v3

      - name: Enable Corepack and prepare correct Yarn version
        run: |
          corepack enable
          corepack prepare yarn@4.9.1 --activate

      - uses: actions/setup-node@v3
        with:
          node-version: "22.19.0"

      - name: Create NPMRC
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.H3_NPM_TOKEN }}" >> ~/.npmrc
          echo "@h3aven-labs:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo 'registry "https://registry.yarnpkg.com"' >> ~/.yarnrc

      - name: Create .yarnrc.yml
        run: |
          cat <<EOF > .yarnrc.yml
          nodeLinker: node-modules

          npmRegistries:
            "https://npm.pkg.github.com":
              npmAuthToken: ${{ secrets.H3_NPM_TOKEN }}

          npmScopes:
            h3aven-labs:
              npmAlwaysAuth: true
              npmRegistryServer: "https://npm.pkg.github.com"
          EOF

      - name: Cache yarn install
        id: yarn_install_cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-install-${{ github.repository }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: |
          if [ "${{ steps.yarn_install_cache.outputs.cache-hit }}" != "true" ]; then
            yarn install --frozen-lockfile
          fi
          cp .env.sample .env
          if [ "${{ inputs.skip_prisma_setup }}" != "true" ]; then
            yarn prisma:setup:sqlite
          fi

      # Step 4: Generate OpenAPI documentation
      - name: Generate OpenAPI Docs
        run: yarn generate:openapi:docs

      # Step 5: Checkout the corresponding SDK repository
      - name: Checkout ${{ github.event.repository.name }}-sdk
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repository_owner }}/${{ github.event.repository.name }}-sdk
          token: ${{ secrets.H3_NPM_TOKEN }}
          path: sdk

      # Step 6: Bump version in package.json based on input
      - name: Bump version
        id: bump_version
        run: |
          cd sdk
          main_version=$(jq -r .version package.json)
          # Versions can reach the registry without landing on main (e.g. a local
          # `npm publish`), so bump from whichever is higher to avoid E409 on publish
          published_version=$(npm view "$(jq -r .name package.json)" versions --json 2>/dev/null \
            | jq -r 'if type == "array" then .[] else . end' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          current_version=$(printf '%s\n' "$main_version" "$published_version" | grep . | sort -V | tail -1)
          echo "Version on main: $main_version, highest published: ${published_version:-none}, bumping from: $current_version"

          IFS='.' read -r major minor patch <<< "$current_version"
          case "${{ inputs.version_bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac

          new_version="$major.$minor.$patch"
          echo "Bumping ${{ inputs.version_bump }} version: $new_version"
          jq --arg ver "$new_version" '.version = $ver' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "new_version=$new_version" >> "$GITHUB_ENV"

      # Step 7: Copy OpenAPI docs to the SDK repository
      - name: Copy OpenAPI Docs to SDK
        run: |
          openapi_format="${{ inputs.openapi_format }}"
          if [ "$openapi_format" == "json" ]; then
            cp openapi-docs.json sdk/openapi-docs.json
            echo "openapi_file=openapi-docs.json" >> "$GITHUB_ENV"
          else
            cp openapi-docs.yml sdk/openapi-docs.yml
            echo "openapi_file=openapi-docs.yml" >> "$GITHUB_ENV"
          fi

      - name: Cache SDK yarn install
        uses: actions/cache@v4
        with:
          path: |
            sdk/node_modules
            sdk/.yarn/install-state.gz
          key: ${{ runner.os }}-sdk-yarn-${{ github.repository }}-${{ hashFiles('sdk/yarn.lock') }}

      # Step 8: Generate the SDK client files (replaces the SDK repo's generate.yml)
      - name: Generate SDK files
        working-directory: sdk
        env:
          GITHUB_NPM_TOKEN: ${{ secrets.H3_NPM_TOKEN }}
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: |
          if [ ! -f .yarnrc.yml ]; then
            printf 'nodeLinker: node-modules\n' > .yarnrc.yml
          fi
          yarn install
          yarn build-sdk

      # Step 9: Commit, open the release PR and merge it
      - name: Commit and Push to SDK
        working-directory: sdk
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "<>"

          branch_name="release/${{ env.new_version }}"
          git checkout -b "$branch_name"
          git add -A -- . ':!.yarnrc.yml'
          git commit -m "Release version ${{ env.new_version }}"
          # A branch left behind by a failed run must not block this release
          git push -f origin "$branch_name"
          echo "sdk_branch=$branch_name" >> "$GITHUB_ENV"

      - name: Create Pull Request in SDK
        working-directory: sdk
        env:
          GH_TOKEN: ${{ secrets.H3_NPM_TOKEN }}
          SDK_REPO: ${{ github.repository_owner }}/${{ github.event.repository.name }}-sdk
        run: |
          pr_url=$(gh pr list -R "$SDK_REPO" --head "$sdk_branch" --state open --json url -q '.[0].url')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create -R "$SDK_REPO" \
              --base main \
              --head "$sdk_branch" \
              --title "Release version ${{ env.new_version }}" \
              --body "$(printf 'This PR bumps the SDK to version %s.\n\n- Bumped version in package.json\n- Updated %s and the generated client.\n- Automatically triggered by %s from repository %s on branch %s.' \
                "${{ env.new_version }}" "${{ env.openapi_file }}" "${{ github.actor }}" "${{ github.repository }}" "${{ github.ref_name }}")")
          fi
          echo "sdk_pr_url=$pr_url" >> "$GITHUB_ENV"
          echo "Release PR: $pr_url"

      # [skip ci] keeps the SDK repo's publish.yml from republishing this version;
      # it still publishes PRs that are merged by hand (auto_merge false)
      - name: Merge Pull Request in SDK
        if: inputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.H3_NPM_TOKEN }}
        run: |
          # GitHub computes mergeability asynchronously right after the PR is created
          for _ in 1 2 3 4 5 6; do
            if gh pr merge "$sdk_pr_url" --squash --admin --delete-branch \
              --subject "Release version ${{ env.new_version }} [skip ci]"; then
              exit 0
            fi
            sleep 3
          done
          echo "Failed to merge $sdk_pr_url"
          exit 1

      - name: Publish SDK
        if: inputs.auto_merge == 'true'
        working-directory: sdk
        env:
          GITHUB_NPM_TOKEN: ${{ secrets.H3_NPM_TOKEN }}
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: npm publish

      - name: Tag and notify
        if: inputs.auto_merge == 'true'
        working-directory: sdk
        env:
          SDK_REPO: ${{ github.repository_owner }}/${{ github.event.repository.name }}-sdk
        run: |
          git fetch -q origin main
          git tag -f "v${{ env.new_version }}" FETCH_HEAD
          git push -f origin "v${{ env.new_version }}"

          curl -s -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "${SDK_REPO#*/} v${{ env.new_version }} published!
          Action Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{status: "success", text: $text}')" \
            "${{ secrets.SLACK_VERSION_UPDATES_WEBHOOK_URL }}" || true

      # Step 10: Checkout the docs repository
      - name: Checkout docs repository
        if: inputs.update_docs
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repository_owner }}/docs
          token: ${{ secrets.H3_NPM_TOKEN }}
          path: docs

      # Step 11: Copy OpenAPI docs to docs repository api-reference folder
      - name: Copy OpenAPI Docs to Docs
        if: inputs.update_docs
        run: |
          openapi_format="${{ inputs.openapi_format }}"
          mkdir -p docs/api-reference
          if [ "$openapi_format" == "json" ]; then
            cp openapi-docs.json docs/api-reference/openapi-docs.json
            echo "docs_openapi_file=api-reference/openapi-docs.json" >> "$GITHUB_ENV"
          else
            cp openapi-docs.yml docs/api-reference/openapi.yml
            echo "docs_openapi_file=api-reference/openapi.yml" >> "$GITHUB_ENV"
          fi

      # Step 12: Commit and push changes to docs repository
      - name: Commit and Push to Docs
        if: inputs.update_docs
        run: |
          cd docs
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "<>"

          # Create a new branch
          branch_name="update-openapi-file/${{ env.new_version }}"
          git checkout -b "$branch_name"

          # Add changes
          git add ${{ env.docs_openapi_file }}

          # Prepare commit message
          commit_message="Update API reference for version ${{ env.new_version }}"
          if [ "${{ inputs.auto_merge }}" == "true" ]; then
            commit_message="$commit_message --auto-merge"
          fi

          # Commit changes
          git commit -m "$commit_message"

          # Push the new branch to the docs repository
          git push origin "$branch_name"

      - name: Create Pull Request in Docs
        if: inputs.update_docs
        env:
          GITHUB_API_URL: https://api.github.com
          DOCS_REPO_OWNER: ${{ github.repository_owner }}
          DOCS_REPO_NAME: docs
          PR_TITLE: "Update API reference for version ${{ env.new_version }}"
          PR_BODY: "This PR updates the API reference documentation for version ${{ env.new_version }}.\n\n- Updated ${{ env.docs_openapi_file }}.\n- Automatically triggered by ${{ github.actor }} from repository ${{ github.repository }} on branch ${{ github.ref_name }}."
          PR_HEAD: update-openapi-file/${{ env.new_version }}
          PR_BASE: main
          DOCS_REPO_TOKEN: ${{ secrets.H3_NPM_TOKEN }}
        run: |
          # Construct the JSON payload for the PR
          PR_DATA=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg head "$PR_HEAD" \
            --arg base "$PR_BASE" \
            --arg body "$PR_BODY" \
            '{title: $title, head: $head, base: $base, body: $body}')

          # Make the API request to create the PR
          response=$(curl -s -o docs_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${{ secrets.H3_NPM_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "$GITHUB_API_URL/repos/$DOCS_REPO_OWNER/$DOCS_REPO_NAME/pulls" \
            -d "$PR_DATA")

          # Check the response code
          if [ "$response" -eq 201 ]; then
            curl -H "Content-Type: application/json" \
                 -d "{
                 \"text\": \
                 \"new PR opened in docs for API reference update to version ${{ env.new_version }}. \n\Link to PR: https://github.com/$DOCS_REPO_OWNER/$DOCS_REPO_NAME/pulls\"
                 }"\
                 ${{ secrets.SLACK_VERSION_UPDATES_WEBHOOK_URL }}
            echo "Pull request created successfully in docs repository."
          elif [ "$response" -eq 422 ]; then
            echo "A pull request for branch '$PR_HEAD' already exists or no changes to commit."
          else
            echo "Failed to create pull request in docs repository. HTTP status code: $response"
            cat docs_response.json
            exit 1
          fi
